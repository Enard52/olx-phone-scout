<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">olx-phone-scout</title>
  <desc id="desc">olx-phone-scout находит самые выгодные б/у телефоны на OLX.kz. Рядом с названием — первая запись реального отчёта: iPhone 11 Pro Max 256GB за 80 000 ₸, его плюсы и предупреждение, что продавец за городом.</desc>
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2ee6a8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0b1220"/>
  <rect width="1200" height="400" rx="26" fill="url(#glow)"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, 'JetBrains Mono', monospace" font-size="21" font-weight="600" fill="#2ee6a8">$ ./run.sh --location alm</text>
    <text x="0" y="168" font-size="62" font-weight="800" letter-spacing="-2" fill="#eef2f7">olx-phone-scout</text>
    <text x="0" y="222" font-size="27" fill="#eef2f7">Находит <tspan fill="#2ee6a8" font-weight="700">самые выгодные б/у телефоны</tspan></text>
    <text x="0" y="258" font-size="27" fill="#eef2f7">на OLX.kz и сравнивает их цену с рынком.</text>

    <g id="stats" transform="translate(0 296)" font-size="20">
      <rect width="196" height="58" rx="12" fill="#131c2e" stroke="#26334a"/>
      <text x="18" y="37" fill="#8a99b3"><tspan fill="#eef2f7" font-weight="700" font-size="24">6557</tspan>  объявлений</text>
      <rect x="210" width="190" height="58" rx="12" fill="#131c2e" stroke="#26334a"/>
      <text x="228" y="37" fill="#8a99b3"><tspan fill="#eef2f7" font-weight="700" font-size="24">22</tspan>  брендов</text>
      <rect x="414" width="204" height="58" rx="12" fill="#131c2e" stroke="#26334a"/>
      <text x="432" y="37" fill="#8a99b3"><tspan fill="#eef2f7" font-weight="700" font-size="24">102</tspan>  цен</text>
    </g>
  </g>

  <g id="report-entry" transform="translate(744 52)" font-family="ui-monospace, SFMono-Regular, Menlo, 'JetBrains Mono', monospace">
    <rect width="400" height="296" rx="18" fill="#131c2e" stroke="#26334a"/>
    <text x="28" y="42" font-size="18" letter-spacing="1.5" fill="#8a99b3">МЕСТО #1 · 15–80 тыс. ₸</text>
    <text x="28" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="25" font-weight="700" fill="#eef2f7">iPhone 11 Pro Max 256GB</text>
    <text x="28" y="118" font-size="28" font-weight="600" fill="#2ee6a8">80 000 ₸</text>
    <text x="28" y="146" font-size="18" fill="#8a99b3">2019 · Б/у · Гульдала</text>
    <line x1="28" y1="164" x2="372" y2="164" stroke="#26334a"/>
    <g font-size="20" fill="#eef2f7">
      <text x="28" y="196"><tspan fill="#2ee6a8">+</tspan> Топовый флагман</text>
      <text x="28" y="224"><tspan fill="#2ee6a8">+</tspan> Батарея 95%+</text>
      <text x="28" y="252"><tspan fill="#2ee6a8">+</tspan> Отличное состояние</text>
      <text x="28" y="280" fill="#f5b84b">! За городом: ехать</text>
    </g>
  </g>
</svg>
