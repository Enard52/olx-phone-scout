<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How olx-phone-scout works</title>
  <desc id="desc">Three pipeline steps. Scrape: OLX search split into price slices under the 1000-result cap, saved to all_listings.json. Recategorize: brand and model from messy titles, 22 brands with typos, split into androids, iphones and unknown. Analyze: Kimovil specs and market price give a value score, written to the TOP 50 report. A real run analyzed 6,557 listings.</desc>

  <rect width="1200" height="380" rx="26" fill="#0b1220"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <!-- step cards: 336 wide, 40 gap, starting at 56 -->
    <g id="scrape" transform="translate(56 48)">
      <rect width="336" height="236" rx="18" fill="#131c2e" stroke="#26334a"/>
      <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" fill="#2ee6a8">01 · --scrape</text>
      <text x="28" y="88" font-size="30" font-weight="700" fill="#eef2f7">Every listing</text>
      <text x="28" y="126" font-size="20" fill="#c3cddd">Price range split into</text>
      <text x="28" y="154" font-size="20" fill="#c3cddd">slices under OLX's cap</text>
      <text x="28" y="182" font-size="20" fill="#c3cddd">of 1000 results</text>
      <text x="28" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8a99b3">→ all_listings.json</text>
    </g>

    <g id="recategorize" transform="translate(432 48)">
      <rect width="336" height="236" rx="18" fill="#131c2e" stroke="#26334a"/>
      <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" fill="#2ee6a8">02 · --recategorize</text>
      <text x="28" y="88" font-size="30" font-weight="700" fill="#eef2f7">Brand + model</text>
      <text x="28" y="126" font-size="20" fill="#c3cddd">22 brands, Cyrillic and</text>
      <text x="28" y="154" font-size="20" fill="#c3cddd">typos: «xioami», «poko»</text>
      <text x="28" y="182" font-size="20" fill="#c3cddd">exchange wishes skipped</text>
      <text x="28" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8a99b3">→ androids / iphones</text>
    </g>

    <g id="analyze" transform="translate(808 48)">
      <rect width="336" height="236" rx="18" fill="#131c2e" stroke="#2ee6a8" stroke-opacity="0.6"/>
      <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" fill="#2ee6a8">03 · --analyze</text>
      <text x="28" y="88" font-size="30" font-weight="700" fill="#eef2f7">Value score</text>
      <text x="28" y="126" font-size="20" fill="#c3cddd">Kimovil specs + market</text>
      <text x="28" y="154" font-size="20" fill="#c3cddd">price, condition, age;</text>
      <text x="28" y="182" font-size="20" fill="#c3cddd">optional AI read</text>
      <text x="28" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8a99b3">→ TOP_RECOMMENDATIONS</text>
    </g>

    <g id="arrows" stroke="#2ee6a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M398 166 h28 m-9 -9 l9 9 l-9 9"/>
      <path d="M774 166 h28 m-9 -9 l9 9 l-9 9"/>
    </g>

    <g id="real-run" transform="translate(56 312)">
      <text x="0" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8a99b3">real run · Almaty region · 15k–80k KZT · <tspan fill="#eef2f7" font-weight="600">6,557 listings analyzed</tspan> · top 50 ranked</text>
    </g>
  </g>
</svg>
