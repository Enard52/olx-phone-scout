[project]
name = "olx-phone-scout"
version = "1.0.1"
description = "Finds the best-value used phones on OLX.kz: scrapes listings, adds Kimovil specs, scores price against market value"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniil Petrov" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "tqdm>=4.66.1",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "cerebras-cloud-sdk>=1.0.0",
    "openai>=1.68.0",
    "httpx>=0.28.1",
    "market-sources",
    "loguru>=0.7.3",
    "curl-cffi>=0.16.3",
    "selectolax>=1.0.0",
]

[tool.uv.sources]
market-sources = { git = "https://github.com/octrow/market-sources", branch = "main" }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# RUFF CONFIGURATION - Fast Python Linter & Formatter
# =============================================================================

[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length to match Black's default
line-length = 100

# Directories to exclude
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "data", # Exclude data directory
    "logs", # Exclude logs directory
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort (import sorting)
    "N", # pep8-naming
    "UP", # pyupgrade (Python version upgrades)
    "B", # flake8-bugbear (common bugs)
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "PL", # Pylint
    "RUF", # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501", # Line too long (handled by formatter)
    # NICE TO USE "PLR0913", # Too many arguments (complex analysis functions need many params)
    # NICE TO USE "PLR2004", # Magic value in comparison (scoring thresholds are intentional)
    "RET504", # Unnecessary variable assignment before return
    "SIM108", # Use ternary operator (can reduce readability)
    "B905", # zip() without explicit strict= (Python 3.10+ feature, we support 3.13+)
    "G004", # Logging f-string - OK in Python 3.12+ (more readable than % formatting)
    "RUF001", # String contains ambiguous `Н` (CYRILLIC CAPITAL LETTER EN). Did you mean `H` (LATIN CAPITAL LETTER H)?
    "RUF002", #  Docstring contains ambiguous `а` (CYRILLIC SMALL LETTER A). Did you mean `a` (LATIN SMALL LETTER A)?
    "RUF003", # Comment contains ambiguous `а` (CYRILLIC SMALL LETTER A). Did you mean `a` (LATIN SMALL LETTER A)?
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Test files
"test_*.py" = ["PLR2004", "S101", "PLC0415", "PTH123", "SIM117"]  # local imports, open(), nested patch() read fine in tests

# __init__ files - allow unused imports for re-exports
"__init__.py" = ["F401"]

# Pipeline entry point: run steps take the CLI options positionally
"main.py" = [
    "PLR0915", # Allow many statements in main()
    "PLR0917", # run_analyzer(...) mirrors the CLI flags
]

# ponytail: existing complexity, refactor before dropping these
"src/analysis/analyzer.py" = ["PLR0917"]
"src/ai/cloud_llm.py" = ["PLR0917"]
"src/enrichment/kimovil_scraper.py" = [
    "PLR0912", "PLR0915", # _parse_and_convert_types: one branch per Kimovil field
    "PLR2004", "PLW2901", "RUF012",
]


# Configuration file - allow non-top-level imports for dynamic loading
"config.py" = [
    # NICE TO USE "PLC0415",  # Allow imports in functions
    "PTH123", # Allow open() for backward compatibility
]

# Scraper - intentional Cyrillic text, allow some complexity
"src/improved_scraper.py" = [
    "RUF001", # Allow Cyrillic characters (Russian/Kazakh text)
    "PTH123", # Path.open() migration in progress
]

# Analyzer - complex analysis logic, allow some flexibility
"src/android_analyzer_with_specs.py" = [
    "PLR0912", # Complex analysis requires branching (value scoring, AI fallback)
    "PLR0913", # Many config parameters for __init__ (11 AI/config options)
    "PLR0915", # Long analysis functions (calculate_value_score, analyze_all, save_results)
]

# Utility files - allow conditional imports and Russian text
"src/utils/*.py" = [
    "PLC0415", # Lazy imports for optional features
    "PLR0911", # Allow multiple returns (guard clauses in parsing)
    "PLR0912", # Allow complex branching (AI analyzers, coverage)
    "PLR0913", # Allow many arguments (logging/stats functions)
    "PLR0915", # Allow long functions (batch processing, AI retries)
    "PTH123", # Path.open() migration in progress
    "RUF001", # Cyrillic text in prompts/messages
    "T201", # Allow print() statements
]

# Market prices - large data file, ignore complexity warnings
"src/utils/market_prices.py" = [
    "PLR0915", # Large data structure
]

# Scoring config - intentional magic numbers for scoring rules
"src/utils/scoring_config.py" = [
    "PLR2004", # Magic numbers are scoring thresholds
]

# Constants file - intentional Cyrillic for status labels
"src/constants.py" = [
    "RUF001", # Cyrillic text is intentional
]

# Demo files - intentional patterns for demonstration
"demo_*.py" = [
    "PLC0415", # Lazy imports in demos
    "PLR2004", # Magic numbers for thresholds
]

[tool.ruff.lint.isort]
# Group imports
known-first-party = ["src", "utils"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
# Max complexity for functions
max-complexity = 15

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"

# Enable docstring formatting
docstring-code-format = true
docstring-code-line-length = 88

# =============================================================================
# MYPY CONFIGURATION - Static Type Checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too noisy, disable for now
warn_unused_configs = true
disallow_untyped_defs = false  # Start relaxed, tighten gradually
disallow_any_generics = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Disable for now
warn_no_return = true
check_untyped_defs = false  # Too strict for now

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "bs4.*",
    "cerebras_cloud_sdk.*",
    "google.genai.*",
    "requests.*",
    "constants",
    "utils.*",
]
ignore_missing_imports = true

# openai's installed stubs crash mypy 1.16.1 with an INTERNAL ERROR when
# followed; skip descending into it (nothing here imports its internals).
[[tool.mypy.overrides]]
module = ["openai.*"]
follow_imports = "skip"

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]

# =============================================================================
# PYLINT CONFIGURATION - Static Code Analyzer
# =============================================================================

[tool.pylint.main]
fail-under = 7.0
ignore = ["CVS", ".git", "__pycache__", ".venv", "venv", ".mypy_cache", ".ruff_cache", "data", "logs"]
jobs = 0
persistent = true

[tool.pylint.messages_control]
disable = [
    "C0111", # missing-docstring
    "C0103", # invalid-name
    "C0301", # line-too-long (handled by ruff and black)
    "C0413", # wrong-import-position - sys.path manipulation required for project structure
    "C0415", # import-outside-toplevel - used for optional dependencies and lazy imports
    "E0401", # import-error - modules imported after sys.path manipulation
    "E1101", # no-member - false positives with Pydantic properties
    "R0801", # duplicate-code - will refactor common patterns into shared utilities
    "R0902", # too-many-instance-attributes - needed for complex analyzer classes
    "R0911", # too-many-return-statements - guard clauses pattern is idiomatic Python
    "R0912", # too-many-branches - complex analysis logic requires branching
    "R0913", # too-many-arguments (already handled by ruff)
    "R0914", # too-many-locals
    "R0915", # too-many-statements (already handled by ruff)
    "R0917", # too-many-positional-arguments - needed for analyzer configuration
    "R1702", # too-many-nested-blocks - parsing logic requires nesting
    "W0511", # fixme - TODO comments are tracked separately
    "W0621", # redefined-outer-name - false positives with function parameters
    "W0718", # broad-exception-caught - intentional for robust error handling with logging
    "W1203", # logging-fstring-interpolation - f-strings are fine in Python 3.12+
]

[tool.pylint.format]
max-line-length = 100

# =============================================================================
# BLACK CONFIGURATION - Code Formatter
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | venv
  | data
  | logs
)/
'''

# =============================================================================
# ISORT CONFIGURATION - Import Sorting
# =============================================================================

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "utils"]
skip = [".venv", "venv", ".mypy_cache", ".ruff_cache", "data", "logs"]
skip_gitignore = true

# =============================================================================
# VULTURE CONFIGURATION - Dead Code Detection
# =============================================================================

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["*/.venv/*", "*/venv/*", "*/data/*", "*/logs/*"]
ignore_names = ["test_*", "*_test", "cls"]
